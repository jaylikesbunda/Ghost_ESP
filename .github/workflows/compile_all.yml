name: Compile Ghost ESP

on:
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Select the build type"
        required: true
        type: choice
        options:
          - "build-only"
          - "prerelease"
          - "all"
        default: "build-only"
      releaseVersion:
        description: "Release tag (e.g. v1.7.2). Leave empty to auto-generate"
        required: false
        type: string
        default: ""
      releaseName:
        description: "Release name (e.g. 'Bug Fix Release'). Leave empty for auto-generated"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build for ${{ matrix.target.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - { name: "esp32-generic",          idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.default.esp32",                   zip_name: "esp32-generic.zip" }
          - { name: "esp32s2-generic",         idf_target: "esp32s2", sdkconfig_file: "configs/sdkconfig.default.esp32s2",                 zip_name: "esp32s2-generic.zip" }
          - { name: "esp32s3-generic",         idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.default.esp32s3",                 zip_name: "esp32s3-generic.zip" }
          - { name: "esp32c3-generic",         idf_target: "esp32c3", sdkconfig_file: "configs/sdkconfig.default.esp32c3",                 zip_name: "esp32c3-generic.zip" }
          - { name: "esp32c5-generic",         idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.default.esp32c5",                 zip_name: "esp32c5-generic-v01.zip" }
          - { name: "esp32c6-generic",         idf_target: "esp32c6", sdkconfig_file: "configs/sdkconfig.default.esp32c6",                 zip_name: "esp32c6-generic.zip" }
          - { name: "CrowPanel Advanced P4 7/9/10.1-inch", idf_target: "esp32p4", sdkconfig_file: "configs/sdkconfig.crowpanel_advanced_p4_mipi_1024x600", zip_name: "CrowPanel_Advanced_P4_7_9_10.1inch.zip" }
          - { name: "CrowPanel Advanced P4 7/9/10.1-inch v1.1", idf_target: "esp32p4", sdkconfig_file: "configs/sdkconfig.crowpanel_advanced_p4_mipi_1024x600_v11", zip_name: "CrowPanel_Advanced_P4_7_9_10.1inch_v1.1.zip" }
          - { name: "CrowPanel Advanced P4 5-inch", idf_target: "esp32p4", sdkconfig_file: "configs/sdkconfig.crowpanel_advanced_p4_rgb_800x480", zip_name: "CrowPanel_Advanced_P4_5inch.zip" }
          - { name: "Awok V5",                 idf_target: "esp32s2", sdkconfig_file: "configs/sdkconfig.default.esp32s2",                 zip_name: "esp32v5_awok.zip" }
          - { name: "ghostboard",              idf_target: "esp32c6", sdkconfig_file: "configs/sdkconfig.ghostboard",                      zip_name: "ghostboard.zip" }
          - { name: "MarauderV4_FlipperHub",   idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.marauderv4",                      zip_name: "MarauderV4_FlipperHub.zip", ota: true, ota_slot_size: 6291456, board_key: "marauderv4" }
          - { name: "MarauderV6&AwokDual",     idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.marauderv6",                      zip_name: "MarauderV6_AwokDual.zip" }
          - { name: "AwokMini",                idf_target: "esp32s2", sdkconfig_file: "configs/sdkconfig.awokmini",                        zip_name: "AwokMini.zip" }
          - { name: "ESP32-S3-Cardputer",      idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.cardputer",                       zip_name: "ESP32-S3-Cardputer.zip", ota: true, ota_slot_size: 4001792, board_key: "cardputer" }
          - { name: "Heltec V3",               idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.heltecv3",                        zip_name: "HeltecV3.zip" }
          - { name: "CYD2USB",                 idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYD2USB",                         zip_name: "CYD2USB.zip" }
          - { name: "CYDMicroUSB",             idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYDMicroUSB",                     zip_name: "CYDMicroUSB.zip" }
          - { name: "CYDDualUSB",              idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYDDualUSB",                      zip_name: "CYDDualUSB.zip" }
          - { name: "CYD2USB2.4_Inch",         idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYD2USB2.4Inch",                  zip_name: "CYD2USB2.4Inch.zip" }
          - { name: "CYD2USB2.4_Inch_C",       idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYD2USB2.4Inch_C_Varient",        zip_name: "CYD2USB2.4Inch_C.zip" }
          - { name: "CYD2432S028R",            idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.CYD2432S028R",                    zip_name: "CYD2432S028R.zip" }
          - { name: "Waveshare_LCD",           idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.waveshare7inch",                  zip_name: "Waveshare_LCD.zip", ota: true, ota_slot_size: 4001792, board_key: "waveshare7inch" }
          - { name: "Crowtech_LCD",            idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowtech7inch",                   zip_name: "Crowtech_LCD.zip" }
          - { name: "CrowPanel 4.2-inch E-paper", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_42_epaper",          zip_name: "CrowPanel_4.2_Epaper.zip" }
          - { name: "CrowPanel 5.79-inch E-paper", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_579_epaper",        zip_name: "CrowPanel_5.79_Epaper.zip" }
          - { name: "CrowPanel Advance 7-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance7",              zip_name: "CrowPanel_Advance_7inch.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance7" }
          - { name: "CrowPanel Advance 5-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance5",              zip_name: "CrowPanel_Advance_5.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance5" }
          - { name: "CrowPanel Advance 4.3-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance43",            zip_name: "CrowPanel_Advance_43.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance43" }
          - { name: "CrowPanel Advance 3.5-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance35",            zip_name: "CrowPanel_Advance_35.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance35" }
          - { name: "CrowPanel Advance 2.8-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance28",            zip_name: "CrowPanel_Advance_28.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance28" }
          - { name: "CrowPanel Advance 2.4-inch", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_advance24",            zip_name: "CrowPanel_Advance_24.zip", ota: true, ota_slot_size: 6291456, board_key: "crowpanel_advance24" }
          - { name: "Sunton_LCD",              idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.sunton7inch",                     zip_name: "Sunton_LCD.zip", ota: true, ota_slot_size: 4001792, board_key: "sunton7inch" }
          - { name: "JC3248W535EN_LCD",        idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.JC3248W535EN",                    zip_name: "JC3248W535EN_LCD.zip", ota: true, ota_slot_size: 6291456, board_key: "JC3248W535EN" }
          - { name: "Flipper_JCMK_GPS",        idf_target: "esp32s2", sdkconfig_file: "configs/sdkconfig.flipper.jcmk_gps",               zip_name: "Flipper_JCMK_GPS.zip" }
          - { name: "T-Deck",                  idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.tdeck",                           zip_name: "LilyGo-T-Deck.zip" }
          - { name: "TEmbedC1101",             idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.TEmbedC1101",                     zip_name: "LilyGo-TEmbedC1101.zip", ota: true, ota_slot_size: 6291456, board_key: "LilyGo TEmbedC1101" }
          - { name: "Elecrow CrowPanel 1.28-inch Rotary", idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.crowpanel_1p28_rotary", zip_name: "CrowPanel_1.28inch_Rotary.zip" }
          - { name: "GhostLink P1 Core",     idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.ghostlink_p1_core",           zip_name: "GhostLink_P1_Core.zip" }
          - { name: "GhostLink P1 Peer",     idf_target: "esp32c3", sdkconfig_file: "configs/sdkconfig.ghostlink_p1_peer",           zip_name: "GhostLink_P1_Peer.zip" }
          - { name: "TDongleS3",               idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.TDongleS3",                       zip_name: "LilyGo-TDongleS3.zip", ota: true, ota_slot_size: 6291456, board_key: "LilyGo T-Dongle-S3" }
          - { name: "TDongleC5",               idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.TDongleC5",                       zip_name: "LilyGo-TDongleC5.zip", ota: true, ota_slot_size: 5767168, board_key: "LilyGo T-Dongle-C5" }
          - { name: "S3TWatch",                idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.S3TWatch",                        zip_name: "LilyGo-S3TWatch-2020.zip", ota: true, ota_slot_size: 4194304, board_key: "S3TWatch" }
          - { name: "TDisplayS3-Touch",        idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.TDisplayS3-Touch",               zip_name: "LilyGo-TDisplayS3-Touch.zip" }
          - { name: "JCMK_DevBoardPro",        idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.JCMK_DevBoardPro",               zip_name: "JCMK_DevBoardPro.zip" }
          - { name: "RabbitLabs_Minion",       idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.minion",                         zip_name: "RabbitLabs_Minion.zip" }
          - { name: "Lolin_S3_Pro",            idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.lolins3pro",                     zip_name: "Lolin_S3_Pro.zip" }
          - { name: "Cardputer ADV",           idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.cardputeradv",                   zip_name: "CardputerADV.zip", ota: true, ota_slot_size: 4001792, board_key: "Cardputer ADV" }
          - { name: "Rabbit-Labs Poltergeist", idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.poltergeist",                    zip_name: "Poltergeist.zip" }
          - { name: "Banshee C5",              idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.somethingsomething",             zip_name: "Banshee_C5.zip", board_key: "somethingsomething" }
          - { name: "Banshee S3",              idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.somethingsomething2",            zip_name: "Banshee_S3.zip", ota: true, ota_slot_size: 4001792, board_key: "somethingsomething2" }
          - { name: "FeberisPro",              idf_target: "esp32",   sdkconfig_file: "configs/sdkconfig.feberispro",                     zip_name: "FeberisPro.zip" }
          - { name: "ACE C5",                  idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.ACE_C5",                         zip_name: "ACE_C5.zip" }
          - { name: "NM-CYD-C5",               idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.NM-CYD-C5",                     zip_name: "NM-CYD-C5.zip", ota: true, ota_slot_size: 5767168, board_key: "NM-CYD-C5" }
          - { name: "ACE S3",                  idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.ACE_S3",                         zip_name: "ACE_S3.zip" }
          - { name: "XIAO_S3_Sense",           idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.xiao_esp32s3_sense",              zip_name: "XIAO_S3_Sense.zip", ota: true, ota_slot_size: 4001792, board_key: "xiao_esp32s3_sense" }
          - { name: "XIAO_S3",                 idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.xiao_esp32s3",                    zip_name: "XIAO_S3.zip", ota: true, ota_slot_size: 4001792, board_key: "xiao_esp32s3" }
          - { name: "M5Stack CoreS3-SE",        idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.m5cores3se",                    zip_name: "M5Stack_CoreS3-SE.zip" }
          - { name: "M5Stack AtomS3R",          idf_target: "esp32s3", sdkconfig_file: "configs/sdkconfig.atoms3r",                      zip_name: "M5Stack_AtomS3R.zip" }
          - { name: "XIAO_C5",                 idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.xiao_esp32c5",                    zip_name: "XIAO_C5.zip" }
          - { name: "Marauder V8",             idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.MarauderV8",                      zip_name: "MarauderV8.zip" }
          - { name: "Marauder Pancake",        idf_target: "esp32c5", sdkconfig_file: "configs/sdkconfig.Pancake",                         zip_name: "MarauderPancake.zip" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        id: cache-idf
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.1-${{ runner.os }}-v1

      - name: Install ESP-IDF Dependencies
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util

      - name: Install ESP-IDF
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone -b v6.1 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh

      - name: Repair cached ESP-IDF Python environment if broken
        if: steps.cache-idf.outputs.cache-hit == 'true'
        run: |
          # The cached venv's bin/python symlinks into the runner's Python
          # toolcache (/opt/hostedtoolcache/Python/3.10.x/...). GitHub bumps
          # the patch version on image updates, evicting the old path and
          # breaking the symlink -- export.sh then fails with "virtual
          # environment not found". Detect that and rebuild just the venv;
          # the toolchains under ~/.espressif/tools stay cached, so this is
          # fast (only pip installs the requirements).
          # Derive the venv name the same way ESP-IDF does (idf_tools.py):
          # idf{MAJOR.MINOR}_py{PY_MAJOR.MINOR}_env. Note: there is no
          # version.txt at the repo root -- the version comes from the
          # esp_idf_version.h header.
          IDF_VER=$(sed -nE 's/^#define ESP_IDF_VERSION_(MAJOR|MINOR) +([0-9]+)/\2/p' \
            ~/esp-idf/components/esp_common/include/esp_idf_version.h | paste -sd.)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          VENV="$HOME/.espressif/python_env/idf${IDF_VER}_py${PY_VER}_env"
          if [ -x "$VENV/bin/python" ]; then
            echo "ESP-IDF Python env is usable: $VENV"
          else
            echo "Cached ESP-IDF Python env ($VENV) is missing or broken; recreating..."
            rm -rf "$VENV"
            ~/esp-idf/install.sh
          fi

      - name: Apply Custom SDK Config
        run: |
          rm -f sdkconfig sdkconfig.defaults
          cp "${{ matrix.target.sdkconfig_file }}" sdkconfig.defaults
          cp "${{ matrix.target.sdkconfig_file }}" sdkconfig
          printf "\n# CONFIG_FATFS_USE_DYN_BUFFERS is not set\n" >> sdkconfig.defaults
          printf "\n# CONFIG_FATFS_USE_DYN_BUFFERS is not set\n" >> sdkconfig
          printf "\n# CONFIG_ESP_GDBSTUB_ENABLED is not set\n" >> sdkconfig.defaults
          printf "\n# CONFIG_ESP_GDBSTUB_ENABLED is not set\n" >> sdkconfig

      - name: Set up ESP-IDF Environment
        run: |
          . ~/esp-idf/export.sh
          export IDF_TARGET=${{ matrix.target.idf_target }}
          echo "IDF_TARGET=${{ matrix.target.idf_target }}" >> $GITHUB_ENV

      - name: Preserve custom Wi-Fi cache buffer count on ESP-IDF 6.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          defaults = Path("sdkconfig.defaults").read_text(encoding="utf-8")
          match = re.search(r"^CONFIG_ESP_WIFI_CACHE_TX_BUFFER_NUM=(\d+)\s*$", defaults, re.MULTILINE)
          if not match or match.group(1) == "32":
              raise SystemExit(0)
          value = match.group(1)
          kconfig = Path.home() / "esp-idf/components/esp_wifi/Kconfig"
          source = kconfig.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(config ESP_WIFI_CACHE_TX_BUFFER_NUM\n"
              r"(?:(?!\n\s*config ).)*?\n\s*default )32(\n)",
              re.DOTALL,
          )
          source, count = pattern.subn(
              rf"\g<1>{value}\g<2>",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("ESP-IDF Wi-Fi cache buffer Kconfig layout changed")
          kconfig.write_text(source, encoding="utf-8")
          PY

      - name: Patch ESP-IDF gdbstub compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          idf = Path.home() / "esp-idf"

          gdbstub = idf / "components/esp_gdbstub/src/gdbstub.c"
          source = gdbstub.read_text(encoding="utf-8")
          helper_guard = re.compile(
              r"#if\s*\(?\s*CONFIG_ESP_SYSTEM_GDBSTUB_RUNTIME\s*\|\|\s*CONFIG_ESP_GDBSTUB_SUPPORT_TASKS\s*\)?"
          )
          if helper_guard.search(source):
              source = helper_guard.sub("#if 1", source)
              gdbstub.write_text(source, encoding="utf-8")

          if os.environ["IDF_TARGET"] in {"esp32", "esp32s2", "esp32s3"}:
              xtensa = idf / "components/esp_gdbstub/src/port/xtensa/gdbstub_xtensa.c"
              source = xtensa.read_text(encoding="utf-8")
              source = source.replace("portNUM_PROCESSORS", "CONFIG_FREERTOS_NUMBER_OF_CORES")
              source, tcb_count = re.subn(
                  r"const\s+StaticTask_t\s*\*\s*tcb\s*;",
                  "void *tcb = NULL;",
                  source,
              )
              source, lookup_count = re.subn(
                  r"tcb\s*=\s*esp_gdbstub_find_tcb_by_frame\s*\(frame\)\s*;",
                  "",
                  source,
              )
              source, call_count = re.subn(
                  r"#if\s+(?:XCHAL_HAVE_FP|0)\s+(?=gdbstub_write_fpu_regs\s*\()",
                  "#if 0\n    ",
                  source,
              )
              if tcb_count != lookup_count or tcb_count not in {0, 1}:
                  raise SystemExit(
                      f"unexpected Xtensa FPU patch counts: tcb={tcb_count}, lookup={lookup_count}"
                  )
              xtensa.write_text(source, encoding="utf-8")
          PY

      - name: Clean and Build Project
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults"
        run: |
          . ~/esp-idf/export.sh
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          idf.py clean
          idf.py build || {
            echo "Build failed for ${{ matrix.target.name }}"
            exit 1
          }

      - name: Verify Bootloader Exists
        run: |
          BOOTLOADER_PATH="build/bootloader/bootloader.bin"
          if [ ! -f "$BOOTLOADER_PATH" ]; then
            echo "Error: Bootloader not found at $BOOTLOADER_PATH"
            exit 1
          fi
          echo "Bootloader found at $BOOTLOADER_PATH"

      - name: Check OTA Slot Size
        if: matrix.target.ota == true
        run: |
          APP_BIN="build/Ghost_ESP_IDF.bin"
          APP_SIZE=$(stat -c%s "$APP_BIN")
          SLOT_SIZE=${{ matrix.target.ota_slot_size }}
          echo "App binary: $APP_SIZE bytes; OTA slot budget: $SLOT_SIZE bytes"
          if [ "$APP_SIZE" -ge "$SLOT_SIZE" ]; then
            echo "Error: ${{ matrix.target.name }} firmware ($APP_SIZE bytes) does not fit its OTA slot ($SLOT_SIZE bytes)."
            echo "Either trim the build for this target or revisit its partition table (see partitions_ota_*.csv)."
            exit 1
          fi

      - name: Package Artifacts into ZIP
        run: |
          . ~/esp-idf/export.sh
          ARTIFACT_DIR="packaged_artifacts_${{ matrix.target.name }}"
          ZIP_FILE="${{ matrix.target.zip_name }}"
          ELF_FILE="${ZIP_FILE%.zip}.elf"
          mkdir -p "$ARTIFACT_DIR"
          cp build/partition_table/partition-table.bin "$ARTIFACT_DIR/partitions.bin" || { echo "Failed to copy partition table"; exit 1; }
          cp build/bootloader/bootloader.bin "$ARTIFACT_DIR/bootloader.bin" || { echo "Failed to copy bootloader"; exit 1; }
          cp build/Ghost_ESP_IDF.bin "$ARTIFACT_DIR/firmware.bin" || { echo "Failed to copy app binary"; exit 1; }
          IDF_TARGET="${{ matrix.target.idf_target }}"
          if [ "$IDF_TARGET" != "esp32p4" ] && [ -f build/Ghost_ESP_IDF.elf ]; then
            cp build/Ghost_ESP_IDF.elf "$ARTIFACT_DIR/$ELF_FILE" || { echo "Failed to copy app elf"; exit 1; }
          fi
          # Source flash mode/freq/size from the resolved build config so
          # merge_bin's header re-stamp exactly matches what the binaries were
          # compiled with. merge_bin does NOT recompute each image's SHA-256, so
          # any mismatch here breaks the bootloader's per-boot image check (and a
          # too-small size also makes partitions past that size unreachable).
          get_cfg() { sed -nE "s/^#define $1 \"([^\"]*)\"/\1/p" build/config/sdkconfig.h; }
          FLASH_MODE=$(get_cfg CONFIG_ESPTOOLPY_FLASHMODE)
          FLASH_FREQ=$(get_cfg CONFIG_ESPTOOLPY_FLASHFREQ)
          FLASH_SIZE=$(get_cfg CONFIG_ESPTOOLPY_FLASHSIZE)
          FLASH_MODE=${FLASH_MODE:-dio}
          FLASH_FREQ=${FLASH_FREQ:-40m}
          FLASH_SIZE=${FLASH_SIZE:-4MB}
          if [ "$IDF_TARGET" = "esp32" ] || [ "$IDF_TARGET" = "esp32s2" ]; then
            BOOT_OFFSET=0x1000
          elif [ "$IDF_TARGET" = "esp32p4" ]; then
            BOOT_OFFSET=0x2000
          else
            BOOT_OFFSET=0x0
          fi
          # The app offset is NOT always 0x10000: the OTA tables put otadata
          # there and the first app slot at 0x20000 or above, so a hardcoded
          # offset writes the app over otadata and leaves every app slot empty
          # ("No bootable app partitions"). Read the real offset out of the
          # partition table this build produced -- factory if present, else the
          # lowest OTA slot, which is what the bootloader falls back to when
          # otadata is blank (as it is on a fresh flash).
          APP_OFFSET=$(python3 - "$ARTIFACT_DIR/partitions.bin" <<'PY'
          import pathlib, struct, sys
          FMT = "<2sBBLL16sL"
          SZ = struct.calcsize(FMT)
          table = pathlib.Path(sys.argv[1]).read_bytes()
          factory, ota = None, {}
          for pos in range(0, len(table) - SZ + 1, SZ):
              magic, ptype, subtype, offset, _size, _label, _flags = struct.unpack(
                  FMT, table[pos:pos + SZ])
              if magic != bytes((0xAA, 0x50)):
                  break  # end of table (MD5 entry or padding)
              if ptype != 0x00:  # not an app partition
                  continue
              if subtype == 0x00 and factory is None:
                  factory = offset
              elif 0x10 <= subtype <= 0x1F:
                  ota.setdefault(subtype, offset)
          if factory is None and not ota:
              sys.exit("no factory or ota app partition in table")
          print("0x%x" % (factory if factory is not None else ota[min(ota)]))
          PY
          ) || { echo "Failed to read app offset from partition table"; exit 1; }
          echo "App offset for ${{ matrix.target.name }}: $APP_OFFSET"

          if [ "$IDF_TARGET" = "esp32p4" ]; then
            # CrowPanel releases expose only three flashable binaries. Build a
            # factory bundle based at APP_OFFSET which contains both the P4 app
            # and the C6 image in the slave_fw data partition. The standalone
            # C6 image is intentionally not published as a fourth file.
            SLAVE_OFFSET=$(python3 - "$ARTIFACT_DIR/partitions.bin" <<'PY'
          import pathlib, struct, sys
          FMT = "<2sBBLL16sL"
          SZ = struct.calcsize(FMT)
          table = pathlib.Path(sys.argv[1]).read_bytes()
          found = None
          for pos in range(0, len(table) - SZ + 1, SZ):
              magic, _ptype, _subtype, offset, _size, label, _flags = struct.unpack(
                  FMT, table[pos:pos + SZ])
              if magic != bytes((0xAA, 0x50)):
                  break
              if label.rstrip(b"\0") == b"slave_fw":
                  found = offset
                  break
          if found is None:
              sys.exit("slave_fw partition is missing")
          print("0x%x" % found)
          PY
            ) || { echo "Failed to read slave_fw offset from partition table"; exit 1; }
            echo "C6 payload offset for ${{ matrix.target.name }}: $SLAVE_OFFSET"
            cp "$ARTIFACT_DIR/firmware.bin" "$ARTIFACT_DIR/p4-app.bin"
            python3 - "$APP_OFFSET" "$SLAVE_OFFSET" \
              "$ARTIFACT_DIR/p4-app.bin" firmware/crowpanel_p4/network_adapter.bin \
              "$ARTIFACT_DIR/firmware.bin" <<'PY'
          import pathlib, sys
          app_offset = int(sys.argv[1], 0)
          slave_offset = int(sys.argv[2], 0)
          app = pathlib.Path(sys.argv[3]).read_bytes()
          slave = pathlib.Path(sys.argv[4]).read_bytes()
          output = pathlib.Path(sys.argv[5])
          relative_slave = slave_offset - app_offset
          if relative_slave < len(app):
              raise SystemExit("P4 app overlaps slave_fw partition")
          image = bytearray(b"\xff" * (relative_slave + len(slave)))
          image[:len(app)] = app
          image[relative_slave:relative_slave + len(slave)] = slave
          output.write_bytes(image)
          print(f"Created three-file P4 factory bundle: {len(image)} bytes")
          PY
            rm "$ARTIFACT_DIR/p4-app.bin"
          else
            python3 -m esptool --chip "$IDF_TARGET" merge_bin \
              --output "$ARTIFACT_DIR/merged.bin" \
              --flash_mode "$FLASH_MODE" \
              --flash_freq "$FLASH_FREQ" \
              --flash_size "$FLASH_SIZE" \
              --target-offset 0x0 \
              "$BOOT_OFFSET" "$ARTIFACT_DIR/bootloader.bin" \
              0x8000 "$ARTIFACT_DIR/partitions.bin" \
              "$APP_OFFSET" "$ARTIFACT_DIR/firmware.bin" \
              || { echo "Failed to create merged binary"; exit 1; }
          fi

          zip -j "$ZIP_FILE" "$ARTIFACT_DIR"/* || { echo "Failed to create ZIP $ZIP_FILE"; exit 1; }
          ls -lh "$ZIP_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target.zip_name }}
          path: ${{ matrix.target.zip_name }}

      # Publishes the app-only binary (not the merged/manual-flash image) to
      # Cloudflare R2 for OTA. Only runs for the OTA-eligible boards, and
      # only on an intentional release run -- never on plain PR builds -- to
      # keep R2 usage well inside the free tier. Requires R2_ACCOUNT_ID,
      # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME repo secrets
      # (see the R2 bucket setup notes below the workflow).
      - name: Publish OTA binary to R2
        if: matrix.target.ota == true && github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'build-only'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install --quiet awscli
          APP_BIN="build/Ghost_ESP_IDF.bin"
          SHA256=$(sha256sum "$APP_BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APP_BIN")
          SHORT_SHA="${GITHUB_SHA::7}"
          BOARD_KEY="${{ matrix.target.board_key }}"
          OBJECT_KEY="firmware/${BOARD_KEY}/${GITHUB_RUN_NUMBER}-${SHORT_SHA}.bin"

          aws s3 cp "$APP_BIN" "s3://${{ secrets.R2_BUCKET_NAME }}/${OBJECT_KEY}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            || { echo "Failed to upload $BOARD_KEY firmware to R2"; exit 1; }

          echo "R2_OBJECT_KEY=${OBJECT_KEY}" >> "$GITHUB_ENV"
          echo "R2_SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "R2_SIZE=${SIZE}" >> "$GITHUB_ENV"

          mkdir -p ota_manifest_fragment
          cat > "ota_manifest_fragment/${BOARD_KEY}.json" <<EOF
          {
            "board_key": "${BOARD_KEY}",
            "sha256": "${SHA256}",
            "size": ${SIZE},
            "commit": "${SHORT_SHA}",
            "build_number": ${GITHUB_RUN_NUMBER},
            "object_key": "${OBJECT_KEY}"
          }
          EOF

      - name: Upload OTA manifest fragment
        if: matrix.target.ota == true && github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'build-only'
        uses: actions/upload-artifact@v4
        with:
          name: ota-fragment-${{ matrix.target.board_key }}
          path: ota_manifest_fragment/${{ matrix.target.board_key }}.json

  publish_ota_manifest:
    name: Publish OTA Manifest to R2
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'build-only'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download OTA manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: ota-fragment-*
          path: ota_fragments

      - name: Determine channel and version
        id: ota_version
        run: |
          if [ "${{ github.event.inputs.buildType }}" = "prerelease" ]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          VERSION=$(grep -o 'GHOSTESP_VERSION "[^"]*"' include/core/ghostesp_version.h | cut -d'"' -f2)
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Assemble ota-manifest.json
        env:
          CHANNEL: ${{ steps.ota_version.outputs.channel }}
          VERSION: ${{ steps.ota_version.outputs.version }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone

          channel = os.environ["CHANNEL"]
          version = os.environ["VERSION"]
          # Set this repo secret to the bucket's public/custom-domain base URL
          # once provisioned (e.g. https://ota.ghostesp.dev) -- see the R2
          # setup notes below this workflow. Left blank, download_url is a
          # placeholder the client won't be able to resolve.
          public_base = os.environ.get("R2_PUBLIC_BASE", "").rstrip("/")

          manifest = {
              "schema_version": 1,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "boards": {},
          }

          for frag_path in sorted(glob.glob("ota_fragments/ota-fragment-*/*.json")):
              with open(frag_path, "r", encoding="utf-8") as fp:
                  frag = json.load(fp)
              board_key = frag["board_key"]
              key = f"{board_key}-prerelease" if channel == "prerelease" else board_key
              manifest["boards"][key] = {
                  "channel": channel,
                  "version": version,
                  "build_number": frag["build_number"],
                  "commit": frag["commit"],
                  "sha256": frag["sha256"],
                  "size": frag["size"],
                  "download_url": f"{public_base}/{frag['object_key']}" if public_base else frag["object_key"],
              }

          with open("ota-manifest.json", "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, indent=2, sort_keys=True)
              fp.write("\n")

          print(f"Assembled manifest with {len(manifest['boards'])} board entries")
          PY

      - name: Upload manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install --quiet awscli
          aws s3 cp ota-manifest.json "s3://${{ secrets.R2_BUCKET_NAME }}/ota-manifest.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            || { echo "Failed to upload ota-manifest.json to R2"; exit 1; }

  update_manifest_for_commit:
    name: Update Commit Manifest (push)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.buildType != 'build-only'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_build_artifacts

      - name: Fetch current run artifact index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifact_index.json

      - name: Update root manifest with commit configs
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          now = datetime.now(timezone.utc).isoformat()

          path = "firmware-manifest.json"
          if os.path.isfile(path):
            with open(path, "r", encoding="utf-8") as fp:
              manifest = json.load(fp)
          else:
            manifest = {
              "schema_version": 2,
              "repository": repo,
              "generated_by": "compile_all.yml",
              "commits": {},
            }

          manifest["schema_version"] = 2
          manifest["repository"] = repo
          manifest["updated_at"] = now

          zips = sorted({os.path.basename(p) for p in glob.glob("all_build_artifacts/**/*.zip", recursive=True)})
          with open("artifact_index.json", "r", encoding="utf-8") as fp:
            artifact_index = json.load(fp)
          artifacts = artifact_index.get("artifacts", [])
          artifact_ids = {a.get("name"): a.get("id") for a in artifacts if a.get("name") and a.get("id")}

          items = []
          for zip_name in zips:
            artifact_name = f"artifact-{zip_name}"
            artifact_id = artifact_ids.get(artifact_name)
            download_url = None
            if artifact_id is not None:
              download_url = f"https://github.com/{repo}/actions/runs/{run_id}/artifacts/{artifact_id}"
            items.append({
              "config": Path(zip_name).stem,
              "zip_name": zip_name,
              "channel": "commit",
              "release_tag": None,
              "download_url": download_url,
              "artifact_run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
            })

          commits = manifest.setdefault("commits", {})
          entry = commits.get(sha, {})
          refs = entry.get("release_refs", [])
          entry.update({
            "source_commit": sha,
            "last_channel": "commit",
            "last_tag": None,
            "updated_at": now,
            "configs": items,
            "release_refs": refs,
          })
          commits[sha] = entry

          with open(path, "w", encoding="utf-8") as fp:
            json.dump(manifest, fp, indent=2, sort_keys=True)
            fp.write("\n")
          PY

      # - name: Commit root manifest
      #   env:
      #     BRANCH: ${{ github.event.repository.default_branch }}
      #   run: |
      #     git add firmware-manifest.json
      #     if git diff --cached --quiet; then
      #       echo "Manifest unchanged; no commit needed."
      #     else
      #       git fetch origin "${BRANCH}"
      #       git reset --soft FETCH_HEAD
      #       git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update firmware manifest for ${GITHUB_SHA::7} [skip ci]"
      #       git push origin "HEAD:${BRANCH}"
      #     fi

  upload_prerelease:
    name: Create Pre-release and Upload Artifacts
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.buildType == 'prerelease'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_build_artifacts

      - name: Verify and Prepare Artifacts for Upload
        run: |
          mkdir -p release_assets
          find all_build_artifacts -name '*.zip' -exec cp {} release_assets/ \;
          echo "Prepared release assets:"
          ls -lh release_assets

      - name: Generate Pre-release Tag and Title
        id: pre_release_info
        run: |
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            TAG_NAME="${{ github.event.inputs.releaseVersion }}"
          else
            TAG_NAME="prerelease-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          fi

          if [ -n "${{ github.event.inputs.releaseName }}" ]; then
            TITLE="${{ github.event.inputs.releaseName }}"
          elif [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            TITLE="Release $TAG_NAME"
          else
            TITLE="Pre-release $(date +'%Y-%m-%d %H:%M:%S')"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT
          echo "Generated Tag: $TAG_NAME"
          echo "Generated Title: $TITLE"

      - name: Update Root Firmware Manifest
        env:
          TAG: ${{ steps.pre_release_info.outputs.tag_name }}
          CHANNEL: prerelease
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          channel = os.environ["CHANNEL"]
          sha = os.environ["GITHUB_SHA"]
          now = datetime.now(timezone.utc).isoformat()

          path = "firmware-manifest.json"
          if os.path.isfile(path):
            with open(path, "r", encoding="utf-8") as fp:
              manifest = json.load(fp)
          else:
            manifest = {
              "schema_version": 2,
              "repository": repo,
              "generated_by": "compile_all.yml",
              "commits": {},
            }

          manifest["schema_version"] = 2
          manifest["repository"] = repo
          manifest["updated_at"] = now

          items = []
          for zip_path in sorted(glob.glob("release_assets/*.zip")):
            zip_name = os.path.basename(zip_path)
            stem = Path(zip_name).stem
            items.append({
              "config": stem,
              "zip_name": zip_name,
              "channel": channel,
              "release_tag": tag,
              "download_url": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
            })

          commits = manifest.setdefault("commits", {})
          entry = commits.get(sha, {})
          refs = entry.get("release_refs", [])
          if not any(r.get("tag") == tag for r in refs):
            refs.append({"tag": tag, "channel": channel, "updated_at": now})

          entry.update({
            "source_commit": sha,
            "last_channel": channel,
            "last_tag": tag,
            "updated_at": now,
            "configs": items,
            "release_refs": refs,
          })
          commits[sha] = entry

          with open(path, "w", encoding="utf-8") as fp:
            json.dump(manifest, fp, indent=2, sort_keys=True)
            fp.write("\n")
          PY

      # - name: Commit Root Manifest to Repository
      #   env:
      #     TAG: ${{ steps.pre_release_info.outputs.tag_name }}
      #     BRANCH: ${{ github.event.repository.default_branch }}
      #   run: |
      #     git add firmware-manifest.json
      #     if git diff --cached --quiet; then
      #       echo "Manifest unchanged; no commit needed."
      #     else
      #       git fetch origin "${BRANCH}"
      #       git reset --soft FETCH_HEAD
      #       git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update firmware manifest for ${TAG} [skip ci]"
      #       git push origin "HEAD:${BRANCH}"
      #     fi

      - name: Create GitHub Pre-Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pre_release_info.outputs.tag_name }}
          TITLE: ${{ steps.pre_release_info.outputs.release_title }}
        run: |
          echo "Creating pre-release with tag $TAG and title '$TITLE'"
          cat > release_notes.md <<EOF
          Automated pre-release build for tag $TAG.

          Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG
          Changelog: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md

          You can flash the bins with https://ghostesp.net/flasher
          EOF
          if [ -z "$(ls -A release_assets/*.zip 2>/dev/null)" ]; then
            echo "No ZIP files found in release_assets. Creating pre-release without assets."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --prerelease
          else
            echo "Uploading assets from release_assets:"
            ls -l release_assets/*.zip
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --prerelease \
              release_assets/*.zip
          fi
          echo "Pre-release creation attempted."

